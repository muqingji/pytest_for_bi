.callout{font-size:12.5px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 16px;margin:14px 0}

.stack{display:grid;gap:0}
figure .sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.bars{display:grid;gap:7px;margin-top:10px}

.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

  <h2>① 怎么看这页图</h2>
  <p class="sub">先花 1 分钟看懂颜色和卡片格式，后面 7 张图都能自己读下来。</p>

  <h3>颜色 = 这一格由「谁 / 什么东西」承担</h3>
  <div class="legend">
    <div class="lg"><span class="dot" style="background:#6d28d9"></span>紫色 · <b>AI</b>（模型 / Agent，负责判断与撰写）</div>
    <div class="lg"><span class="dot" style="background:#0f766e"></span>绿色 · <b>Python</b>（采集取证、算事实）</div>
    <div class="lg"><span class="dot" style="background:#b45309"></span>黄色 · <b>Node / MJS</b>（编排账本、门禁、hook）</div>
    <div class="lg"><span class="dot" style="background:#475569"></span>灰色 · <b>外部系统</b>（数据库、CLI、平台）</div>
    <div class="lg"><span class="dot" style="background:#1d4ed8"></span>蓝色 · <b>产物</b>（证据 JSON、报告、配置）</div>
    <div class="lg"><span class="dot" style="background:#c2410c"></span>橙色 · <b>契约 / 判断</b>（Schema、YAML、决策点）</div>

  </div>

  <h3>一句话总纲</h3>
  <div class="callout">
    <b>这是一套「零重依赖 + 契约驱动 + 知识密集」的技术栈。</b>
    运行时依赖只有 4 个包（Node 1 个 + Python 3 个），
    代码只有 329 个 Python + 189 个 Node 文件，
    却有 <b>1495 个 Markdown</b> 和 <b>21 个 JSON Schema</b>。
    真正的复杂度不在代码里，在「给 AI 看的说明书」和「约束产物的契约」里。
  </div>

<figure id="fig1">
  <h2>② 图 1 · 技术栈全景分层图（从上到下 7 层）</h2>
  <p class="sub">
    读法：越靠上越接近「人和模型」，越靠下越接近「数据」。
    每一层只跟相邻层打交道，<b>不跨层直连</b>——这是这套技术栈最重要的一条结构约束。
  </p>

  <div class="layers">

    <div class="layer">
      <div class="lt">第 1 层 · 宿主层（Host）—— 模型住在这里，用户也在这里</div>
      <div class="row c4">
        <div class="card ext sm"><div class="hd"><span class="ct">AI 编辑器 / CLI</span><span class="who">14 类</span></div>
          <div class="cd">
          <span class="chip">Claude Code 2.1.232</span><span class="chip">Codex 0.147.0</span><span class="chip">Cursor 3.16.17</span><span class="chip">OpenCode 1.18.16</span><span class="chip">MiMoCode 0.1.10</span><span class="chip">Reasonix 1.21.1</span><span class="chip">Pi 0.84.2</span><span class="chip">ZCode</span><span class="chip">CodeBuddy 2.127.3</span><span class="chip">Trae 1.107.1</span><span class="chip">Qoder 1.15.1</span><span class="chip">Grok 1.0.0</span><span class="chip">Kiro</span><span class="chip">Windsurf</span><span class="chip">GitHub Copilot</span>
        </div></div>
        <div class="card art sm"><div class="hd"><span class="ct">生成的宿主配置</span><span class="who">生成物</span></div>
          <div class="cd">全部由 <span class="k">hook-config.json</span> 生成，不手写：<span class="k">.claude/hooks.json</span>、<span class="k">.codex/hooks.json</span>、<span class="k">.cursor/hooks.json</span>、<span class="k">.opencode/plugins/*.ts</span>、<span class="k">.github/copilot-instructions.md</span> 等</div></div>
        <div class="card ext sm"><div class="hd"><span class="ct">终端 / 人</span><span class="who">使用者</span></div>
          <div class="cd">输入一句自然语言（traceId、报错、截图）或一条命令；读 Markdown / HTML 报告</div></div>
        <div class="card py sm"><div class="hd"><span class="ct">环境激活</span><span class="who">Python/Sh</span></div>
          <div class="cd"><span class="k">scripts/env/activate.sh</span> 向上 32 层找 <span class="k">.env.local</span>；<span class="k">setup-tokens.ts</span> 用 Playwright 自动抓 IDP token</div></div>
      </div>
    </div>

    <div class="arrow tall"><span class="lb">宿主把「事件」交给 Hook 引擎</span></div>

    <div class="layer">
      <div class="lt">第 2 层 · Hook 运行时层（Node，零依赖）—— 独立于模型的门禁</div>
      <div class="row c4">
        <div class="card nd sm"><div class="hd"><span class="no">1</span><span class="ct">hook-engine.mjs</span><span class="who">Node</span></div>
          <div class="cd"><b>做什么</b>：读配置、按事件分发、聚合 checker 结果、决定放行或阻断<br><b>输入</b>：宿主事件 payload<br><b>输出</b>：放行 / 阻断 / 注入提示<br><b>用什么</b>：纯 <span class="k">node:*</span> 标准库</div></div>
        <div class="card nd sm"><div class="hd"><span class="no">2</span><span class="ct">20 个 checker</span><span class="who">Node</span></div>
          <div class="cd"><b>做什么</b>：20 个独立校验器，其中 <b>5 个 failClosed</b>（<span class="k">ctx-valid</span>、<span class="k">evidence-index</span>、<span class="k">dispatch-handoff</span>、<span class="k">apl-artifact-write</span>、<span class="k">query-safety</span>）失败即阻断<br><b>输出</b>：pass / warn / block</div></div>
        <div class="card nd sm"><div class="hd"><span class="no">3</span><span class="ct">6 类事件</span><span class="who">Node</span></div>

    <tr><td><span class="k">pandas</span> / <span class="k">numpy</span></td><td>数据聚合在 ClickHouse 侧做完，Python 只搬运结果</td></tr>
    <tr><td><span class="k">pydantic</span></td><td>校验交给 <span class="k">jsonschema</span> + 独立 schema 文件，schema 可被 Node 侧 <span class="k">ajv</span> 复用</td></tr>
    <tr><td><span class="k">jinja2</span></td><td>报告正文由 AI 撰写（仓库铁律），不走模板渲染</td></tr>
    <tr><td><span class="k">fastapi</span> / <span class="k">flask</span></td><td>系统没有服务端，不暴露任何 HTTP 接口</td></tr>
    <tr><td><span class="k">jest</span> / <span class="k">webpack</span> / <span class="k">eslint</span></td><td>测试用 <span class="k">vitest</span> + <span class="k">node:test</span>；没有前端产物需要打包；lint 由 <span class="k">tsc</span> + <span class="k">ruff</span> 承担</td></tr>
  </table>
</figure>

      </div>
    </div></div>

  </div>

  <h3>这条链路暴露出的三条技术分工</h3>
  <table class="tl">
    <tr><th style="width:110px">环节</th><th style="width:150px">谁执行</th><th>技术职责边界</th></tr>
    <tr><td><b>4 / 10 / 13 / 14</b></td><td>紫色 · AI</td><td>只有「决定查什么」「归类领域」「下结论」「写报告」四件事交给模型。<b>模型不碰数据搬运</b></td></tr>

    <tr><td><b>2 / 9 / 15 / 17</b></td><td>黄色 · Node</td><td>门禁与账本：放行判断、证据索引、报告结构、可观测上报。<b>零依赖、可离线跑</b></td></tr>

    <tr><td><b>包管理器</b></td><td><span class="k">pnpm</span>（Node，66 KB lock）+ <span class="k">uv</span>（Python，50 KB lock）；<b>禁止 npm / npx</b>，本地二进制写 <span class="k">pnpm exec</span></td></tr>
    <tr><td><b>Node 运行时依赖</b></td><td><span class="k">proper-lockfile</span> <b>× 1</b></td></tr>
    <tr><td><b>Python 运行时依赖</b></td><td><span class="k">jsonschema</span> / <span class="k">pyyaml</span> / <span class="k">sqlparse</span> <b>× 3</b></td></tr>
    <tr><td><b>开发期依赖</b></td><td>Node 7 个（ts / tsx / vitest / playwright / ajv / markdownlint / @types/node）· Python 2 个（ruff / pytest）</td></tr>
    <tr><td><b>主导标准库</b></td><td>Python：<span class="k">pathlib</span> 237 · <span class="k">json</span> 196 · <span class="k">subprocess</span> 45<br>Node：<span class="k">node:path</span> 142 · <span class="k">node:fs</span> 131 · <span class="k">node:child_process</span> 30</td></tr>
    <tr><td><b>脚本总数</b></td><td><span class="k">package.json</span> 55 个 script（无 <span class="k">dev</span> / <span class="k">build</span> / <span class="k">start</span>）</td></tr>
    <tr><td><b>测试规模</b></td><td>pytest <b>133</b> 文件 + Node 系 <b>54</b> 文件（vitest 14 + <span class="k">node:test</span> 40）= <b>187 个测试文件</b></td></tr>
    <tr><td><b>契约</b></td><td><span class="k">datasources.yaml</span>（10 张 ClickHouse 表）· 21 个 JSON Schema · <span class="k">evidence.yaml</span> · <span class="k">cloud-registry.md</span></td></tr>
    <tr><td><b>Hook</b></td><td>1 引擎 + 20 checker（<b>5 个 failClosed</b>）+ 6 类事件 + 11 个 lib 模块</td></tr>
    <tr><td><b>编辑器接入</b></td><td>14 个宿主配置生成物；AI-Eye 覆盖 <b>12 类</b>编辑器</td></tr>
    <tr><td><b>环境档案</b></td><td><span class="k">fx-ops-profiles.json</span> <b>34</b> 个 profile；cloud-registry <b>14+</b> 云环境</td></tr>
    <tr><td><b>CI</b></td><td>3 个 job / 1 个 stage，全部 <span class="k">allow_failure: false</span></td></tr>
    <tr><td><b>统一验证入口</b></td><td><span class="k">pnpm agents:verify</span>（本地 = pre-push = CI）</td></tr>
    <tr><td><b>数据面</b></td><td>全部 ClickHouse，统一经 IDP Go CLI 访问（Python 不直连）</td></tr>
    <tr><td><b>一句话</b></td><td><b>零重依赖 + 契约驱动 + 知识密集：真正的复杂度在 1495 个 Markdown 和 21 个 Schema 里，不在代码里。</b></td></tr>
  </table>

  <h3>9.2 做得好的地方</h3>
  <table class="tl">
    <tr><th style="width:200px">决策</th><th>收益</th><th style="width:250px">证据</th></tr>
    <tr><td><b>运行时依赖压到 4 个</b></td><td>离线 runner 能装、供应链风险低、升级不痛</td><td>Node 1 个 + Python 3 个</td></tr>
    <tr><td><b>标准库优先</b></td><td>不需要为「读文件、调命令行、拼 JSON」引入任何框架</td><td><span class="k">pathlib</span> 237 / <span class="k">node:fs</span> 131</td></tr>
    <tr><td><b>按产物形态选语言</b></td><td>采集用 Python（文本处理强）、门禁用 Node（零依赖可跑）、知识用 Markdown（AI 直接读）</td><td>见 2.2 职责边界</td></tr>
    <tr><td><b>契约前置</b></td><td>表结构和产物形状是声明的，新增表 / 新增技能不用改采集代码</td><td>10 张表 YAML + 21 个 schema</td></tr>
    <tr><td><b>门禁在最弱环境也能跑</b></td><td>shell runner 上仍能执行结构 / 复杂度硬门禁</td><td>Node 与 Python 双实现读同一份预算文件</td></tr>
    <tr><td><b>统一验证入口</b></td><td>杜绝「CI 过了本地没过」</td><td><span class="k">scripts/agents-verify.mjs</span> 本地 = pre-push = CI</td></tr>
    <tr><td><b>按改动路径路由检查</b></td><td>300 个 Python 文件不必每次全跑</td><td><span class="k">pnpm agents:verify:changed</span></td></tr>
    <tr><td><b>单一真相源 + 生成器</b></td><td>14 个编辑器配置不是手抄 14 份</td><td><span class="k">hook-config.json</span> → 生成器</td></tr>
    <tr><td><b>兼容窗有自动过期</b></td><td>旧证据名不会永久留在代码里</td><td>alias 带 <span class="k">remove_after</span> 日期，到期断言红灯</td></tr>
    <tr><td><b>旁路可观测与主链路解耦</b></td><td>AI-Eye 默认关闭、fail-open，不参与诊断决策</td><td>见 5.4</td></tr>
  </table>

  <h3>9.3 风险点与历史残留</h3>
  <table class="tl">
    <tr><th style="width:190px">风险</th><th>表现</th><th style="width:250px">建议</th></tr>
    <tr><td><b>fx-ops 单点过重</b> 🔴</td><td><b>254</b> 个 Python + <b>42</b> 个 Node + <b>98</b> 个 references，占全仓代码绝大部分；单技能承担全部编排、契约与采集</td><td>structure-audit / complexity-line-gate 已在防，但更彻底的做法是把通用采集库下沉到 <span class="k">.agents/lib/</span></td></tr>
    <tr><td><b><span class="k">@types/node ^22</span> 落后于 <span class="k">engines.node &gt;= 24</span></b></td><td>Node 24 新增 API 缺类型提示</td><td>升到 <span class="k">@types/node ^24</span></td></tr>
    <tr><td><b>三套测试运行时并存</b></td><td>pytest + vitest + <span class="k">node:test</span>，认知成本；「这个测试该放哪」需要判断</td><td>现状是刻意分工，把选择规则写进 skill-development 即可</td></tr>
    <tr><td><b>Markdown 规模难以人工维护</b></td><td>1495 个 md，靠 skill-lint 13 条规则挡语义漂移</td><td>继续把口头规则转成 lint 规则</td></tr>
    <tr><td><b>CI 只有 1 个 stage / 3 个 job</b></td><td>门禁绝大部分靠 <span class="k">core-skill-contracts</span> 单 job 串行跑；一个 check 挂掉整条重跑</td><td>若耗时成为瓶颈，可按 <span class="k">agents:verify</span> 的步骤拆成 parallel jobs</td></tr>
    <tr><td><b>Playwright 用于非 UI 场景</b></td><td>抓 token + 校验 HTML 报告布局，增加约 300 MB 浏览器依赖</td><td>两个场景都没有更轻的替代（真实渲染校验无法用静态分析替代）</td></tr>
  </table>

  <h4 style="font-size:13px;color:#b91c1c;margin:18px 0 6px">已确认的历史残留（不是 bug，但会误导新人）</h4>
  <table class="tl">
    <tr><th style="width:250px">残留</th><th>位置</th><th>说明</th></tr>
    <tr><td><span class="k">python/</span> 目录不存在却被引用</td><td><span class="k">pyproject.toml</span> → <span class="k">pythonpath</span> 与 <span class="k">[tool.hatch.build.targets.wheel] packages</span></td><td>两处都指向不存在的目录。<span class="k">pythonpath</span> 里多余一项无害；<span class="k">packages</span> 说明 hatchling 配置是从模板继承来的</td></tr>
    <tr><td><span class="k">src/</span> 目录不存在却被引用</td><td><span class="k">tsconfig.json</span> → <span class="k">paths</span>；<span class="k">vitest.config.ts</span> → <span class="k">alias</span></td><td>别名 <span class="k">@/</span> 指向不存在的目录，实际无任何文件用它导入</td></tr>
    <tr><td>tsconfig 开启 <span class="k">declaration</span> / <span class="k">sourceMap</span> / <span class="k">outDir</span></td><td><span class="k">tsconfig.json</span></td><td>与 <span class="k">noEmit: true</span> 组合无意义，模板残留</td></tr>
    <tr><td>include 里有不存在的目录</td><td><span class="k">tsconfig.json</span> → <span class="k">agents/**</span>、<span class="k">tools/**</span></td><td>include 不存在的 glob 不报错，但让人误以为有这两个目录</td></tr>
    <tr><td><span class="k">version</span> 双写 <span class="k">0.1.0</span></td><td><span class="k">package.json</span> + <span class="k">pyproject.toml</span></td><td>不发布版本，但两处需手工同步</td></tr>
    <tr><td>旧命名的 biz 别名</td><td><span class="k">AGENTS.md</span> 明令禁止</td><td>例如 <span class="k">open-oauth</span> / <span class="k">open-link-app</span> / <span class="k">wechat-proxy</span> / <span class="k">syncdata</span> 等，必须用新名</td></tr>
  </table>
  <div class="callout">
    <b>这些残留的共同特征：从模板继承的配置没有被清理。</b>它们不影响运行，但会污染新人的心智模型。建议在下次结构性重构时一并清除。
  </div>

  <h3>9.4 结论</h3>
  <div class="note" style="border-left-color:#6d28d9;background:#faf5ff">
    <p style="margin:0 0 8px"><b>这套技术栈最反直觉的地方是：它几乎「没有技术」。</b></p>
    <p style="margin:0 0 8px">没有 web 框架、没有 ORM、没有 HTTP client、没有数据处理库、没有模板引擎、没有前端构建、没有服务端。
    生产依赖一共 <b>4 个包</b>，其余全是标准库。而这个「极其朴素」的技术栈，支撑了 36 个技能、14 类编辑器接入、34 个环境档案和 10 张日志表的完整诊断体系。</p>
    <p style="margin:0 0 8px">原因在于它把复杂度放在了<b>别的地方</b>：</p>
    <ul style="margin:0;padding-left:20px">
      <li><b>1495 个 Markdown</b> 承载领域知识与排查 SOP（这部分本该是代码或配置）</li>
      <li><b>21 个 JSON Schema + 4 份契约</b> 承载接口与产物的形状（这部分本该是类型系统或测试）</li>
      <li><b>20 个 hook checker + 13 条 skill-lint 规则</b> 承载底线约束（这部分本该是 code review 或人的自觉）</li>
    </ul>
    <p style="margin:8px 0 0"><b>所以判断这套技术栈的成熟度，不该看它的代码有多少，而该看它的契约和门禁有多密。</b>
    从「契约漂移能被断言红灯拦住」「口头规则能被 lint 拦住」「兼容窗能自动过期」这三点看，它的工程化程度远高于它的代码规模。</p>
