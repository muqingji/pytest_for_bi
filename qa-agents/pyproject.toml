[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-multi-agent-system"
version = "0.1.0"
description = "Deterministic-first QA multi-agent workflow runtime"
requires-python = ">=3.10"
dependencies = ["pytest>=8.0.0"]

[project.optional-dependencies]
dev = []

[project.scripts]
qa-agents = "qa_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
